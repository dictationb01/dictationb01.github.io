name: Deploy to Firebase Hosting (dictationb1.web.app)

# Keeps https://dictationb1.web.app/ in lockstep with main: every push that
# passes the release gates publishes the same tree GitHub Pages serves.
# Setup (one time): Firebase console -> Project settings -> Service accounts ->
# Generate new private key, then add it as the repository secret
# FIREBASE_SERVICE_ACCOUNT_DICTATIONB1 (Settings -> Secrets and variables ->
# Actions). No key, no deploy — the job skips cleanly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the public tree (strip tests/docs/CI from the upload)
        run: |
          mkdir -p deploy
          tar -cf - \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='*.md' \
            --exclude='*.zip' \
            --exclude='firebase.json' \
            --exclude='.firebaserc' \
            --exclude='.gitignore' \
            . | (cd deploy && tar -xf -)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DICTATIONB1 }}'
          channelId: live
          projectId: dictationb1
          target: apply
        continue-on-error: true
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DICTATIONB1 != '' }}
