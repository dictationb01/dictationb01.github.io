name: release gates

# contract: docs/ARCHITECTURE_MAP.md §12 — the twelve release gates plus the
# v0.0.6.o preserved-payload SHA step (Step 13 / CI-13). Every gate is a
# plain Node script; the browser gates launch the Chromium that ships inside
# @sparticuz/chromium and unpack their own AL2023 libraries.
# v0.0.6.o feature surface (the SPACIOUS Project Overview reading stage with
# the badge relocated to Settings › About, the Studio ↔ Briefing multi-API
# voice bridge — ElevenLabs /with-timestamps wt + Groq/Gemini/OpenRouter ww
# cascade + 3 triggers + live status bar, the stale-audio purge law, the
# continuous karaoke progress bar; plus every preserved v0.0.6.m fix) is
# asserted by G1 §12-13 and the dedicated Lab below (Step 13b).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install gate dependencies (dev-only, never shipped)
        run: npm ci --prefix tests

      - name: System libraries Chromium needs on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libnssutil3 libgbm1 libxkbcommon0 libasound2t64 \
            fonts-dejavu-core || \
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libgbm1 libxkbcommon0 libasound2 fonts-dejavu-core || true

      - name: G1 · static contracts
        run: node tests/check.cjs

      - name: G2 · Sync / Vault / Speech API
        run: node --test tests/upgrade.test.cjs

      - name: G3 · jsdom behaviour
        run: node tests/phase1.cjs

      - name: G4 · config, metadata and the Apps Script loader
        run: node tests/server.cjs

      - name: G5 · Chromium layout, routing, focus law, ring colours
        run: node tests/browser.cjs

      - name: G6 · v60 → 0.0.1.a service-worker upgrade
        run: node tests/upgrade-browser.cjs

      - name: G7 · full student journey
        run: node tests/e2e.cjs

      - name: G8 · offline, dead API and hung relay
        run: node tests/live-lab.cjs

      - name: G9 · retirement, budgets and ES5 audit
        run: node tests/audit-v42.cjs

      - name: G10 · voice spine, GC-safe utterances and Guide 3.0
        run: node tests/voice-guide.cjs

      - name: G11 · PIN verifier, vault publish and persisted lockout
        run: node tests/vault-sync.cjs

      - name: G12 · credit-saver delta, 34-clip pack and locked-studio zero-widget proof
        run: node tests/studio-safety.cjs

      # Pins mirror PRESERVED_SHA in tests/check.cjs (the single source of truth).
      - name: Lab Environment - spacious overview, Studio-Briefing bridge, cache purge, karaoke, mic-release, feedback (Step 13b)
        run: node tests/briefing-feedback-lab.cjs

      # v0.0.6.u: the MANDATORY pre-PR Arena gate — cold-browser Beat-1 race
      # (x2 fresh contexts, delayed 3.8 MB pack), 131-clip unified SoniaNeural
      # pack audit, cross-tab eleven-tier audio and git hygiene.
      - name: G13 · mandatory pre-PR Arena verification gate
        run: node tests/arena-pre-pr-verify.cjs

      # Pins mirror PRESERVED_SHA in tests/check.cjs (the single source of truth).
      - name: Preserved payloads must still match their SHA-256 lock
        run: |
          node -e '
            const fs=require("fs"),c=require("crypto");
            const want={
              "data/session.json":"931037f7","data/gas-source.txt":"591b9b08",
              "assets/fonts/NotoSansSinhala-Regular.woff2":"23f1503e",
              "assets/fonts/NotoSansSinhala-Bold.woff2":"bf59c148"};
            let bad=0;
            for (const [f,p] of Object.entries(want)) {
              const h=c.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
              const ok=h.startsWith(p);
              console.log((ok?"OK   ":"FAIL ")+f+" "+h.slice(0,8));
              if(!ok) bad++;
            }
            process.exit(bad?1:0);
          '
